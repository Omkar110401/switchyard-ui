<div class="login-container">
  <div class="login-wrapper">
    <!-- Branding Section -->
    <div class="branding-section">
      <div class="logo-area">
        <div class="logo">⚡</div>
        <h1 class="logo-text">Switchyard</h1>
      </div>
      <p class="tagline">Workflow Orchestration Platform</p>
    </div>

    <!-- Login Card -->
    <div class="login-card">
      <div class="card-header">
        <h2>Welcome Back</h2>
        <p>Sign in to your account</p>
      </div>

      <form (ngSubmit)="onLogin()" class="login-form">
        <!-- Username Field -->
        <div class="form-group">
          <label class="form-label">Username</label>
          <div class="input-wrapper">
            <input
              class="form-input"
              type="text"
              [(ngModel)]="username"
              name="username"
              placeholder="Enter your username"
              required
            />
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <input
              class="form-input"
              type="password"
              [(ngModel)]="password"
              name="password"
              placeholder="Enter your password"
              required
            />
          </div>
        </div>

        <!-- Error Message -->
        <div class="error-message" *ngIf="errorMessage">
          <span class="error-icon">⚠</span>
          {{ errorMessage }}
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-login" [disabled]="loading">
          <span *ngIf="!loading" class="btn-text">Sign In</span>
          <span *ngIf="loading" class="btn-loading">
            <mat-spinner diameter="16"></mat-spinner>
          </span>
        </button>
      </form>

      <!-- Signup Link -->
      <div class="card-footer">
        <p class="signup-text">
          Don't have an account?
          <a routerLink="/signup" class="signup-link">Create one</a>
        </p>
      </div>
    </div>
  </div>
</div>
